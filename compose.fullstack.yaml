name: gptibo-fullstack
x-storefront-env: &storefront-env
  DB_HOST: storefront-db
  DB_NAME: storefront
  DB_USER: storefront_app
  DB_PASSWORD_FILE: /run/secrets/storefront_app
  DB_SSLMODE: disable
  AUTH_SECRET_FILE: /run/secrets/storefront_auth
  PUBLIC_ORIGIN: ${STOREFRONT_ORIGIN:-http://127.0.0.1:8080}
x-supply-env: &supply-env
  DATABASE_URL_FILE: /run/secrets/supply_runtime_dsn
  MASTER_KEY_FILE: /run/secrets/supply_master
  PUBLIC_ORIGIN: ${SUPPLY_ORIGIN:-http://127.0.0.1:8092}
  CARD_API_ALLOWED_HOSTS: ${CARD_API_ALLOWED_HOSTS:-}
services:
  storefront-db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: storefront
      POSTGRES_USER: storefront_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/storefront_owner
    secrets: [storefront_owner]
    volumes: [storefront-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U storefront_owner -d storefront"]
      interval: 5s
      retries: 20
  supply-db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/supply_owner
    secrets: [supply_owner]
    volumes: [supply-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U platform_owner -d platform"]
      interval: 5s
      retries: 20
  storefront-api:
    build: {context: services/storefront, dockerfile: deploy/Dockerfile}
    image: gptibo-storefront:local
    command: [api]
    environment:
      <<: *storefront-env
      LISTEN_ADDR: 0.0.0.0:8093
    env_file: [services/storefront/.env.integrations]
    secrets: [storefront_app, storefront_auth]
    volumes: [./services/storefront/.secrets/integrations:/run/integrations:ro]
    depends_on:
      storefront-db: {condition: service_healthy}
    restart: unless-stopped
  storefront-worker:
    image: gptibo-storefront:local
    command: [worker]
    environment: *storefront-env
    env_file: [services/storefront/.env.integrations]
    secrets: [storefront_app, storefront_auth]
    volumes: [./services/storefront/.secrets/integrations:/run/integrations:ro]
    depends_on:
      storefront-db: {condition: service_healthy}
    restart: unless-stopped
  storefront-maintenance:
    image: gptibo-storefront:local
    profiles: [maintenance]
    command: [migrate]
    environment:
      DB_HOST: storefront-db
      DB_NAME: storefront
      DB_USER: storefront_owner
      DB_PASSWORD_FILE: /run/secrets/storefront_owner
      DB_SSLMODE: disable
      APP_DB_PASSWORD_FILE: /run/secrets/storefront_app
    secrets: [storefront_owner, storefront_app]
    depends_on:
      storefront-db: {condition: service_healthy}
  supply-api:
    build: {context: services/platform, dockerfile: deploy/Dockerfile}
    image: gptibo-supply:local
    command: [api]
    environment:
      <<: *supply-env
      LISTEN_ADDR: 0.0.0.0:8092
    secrets: [supply_runtime_dsn, supply_master]
    ports: ["127.0.0.1:8092:8092"]
    depends_on:
      supply-db: {condition: service_healthy}
    restart: unless-stopped
  supply-worker:
    image: gptibo-supply:local
    command: [worker]
    environment: *supply-env
    env_file: [services/platform/.env.notifications]
    secrets: [supply_runtime_dsn, supply_master]
    depends_on:
      supply-db: {condition: service_healthy}
    restart: unless-stopped
  supply-maintenance:
    image: gptibo-supply:local
    profiles: [maintenance]
    command: [migrate]
    environment:
      DATABASE_URL_FILE: /run/secrets/supply_owner_dsn
      MASTER_KEY_FILE: /run/secrets/supply_master
      RUNTIME_DB_USER: platform_app
      APP_DB_PASSWORD_FILE: /run/secrets/supply_app
      ADMIN_EMAIL: ${SUPPLY_ADMIN_EMAIL:-}
      ADMIN_PASSWORD_FILE: /run/secrets/supply_admin
    secrets: [supply_owner_dsn, supply_master, supply_app, supply_admin]
    depends_on:
      supply-db: {condition: service_healthy}
  web:
    build: {context: ., dockerfile: deploy/fullstack/Dockerfile.web}
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [storefront-api]
    restart: unless-stopped
volumes:
  storefront-data:
  supply-data:
secrets:
  storefront_owner: {file: ./.secrets/fullstack/storefront-owner}
  storefront_app: {file: ./.secrets/fullstack/storefront-app}
  storefront_auth: {file: ./.secrets/fullstack/storefront-auth}
  supply_owner: {file: ./.secrets/fullstack/supply-owner}
  supply_app: {file: ./.secrets/fullstack/supply-app}
  supply_admin: {file: ./.secrets/fullstack/supply-admin}
  supply_master: {file: ./.secrets/fullstack/supply-master}
  supply_owner_dsn: {file: ./.secrets/fullstack/supply-owner-dsn}
  supply_runtime_dsn: {file: ./.secrets/fullstack/supply-runtime-dsn}
