name: gptibo-supply
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U platform_owner -d platform]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: gptibo-supply:${RELEASE_VERSION:-local}
    environment:
      DATABASE_URL: postgres://platform_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/platform?sslmode=disable
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY}
      LISTEN_ADDR: 0.0.0.0:8092
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8092}
      CARD_API_ALLOWED_HOSTS: ${CARD_API_ALLOWED_HOSTS:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:8092:8092
    restart: unless-stopped
  worker:
    image: gptibo-supply:${RELEASE_VERSION:-local}
    command: [worker]
    environment:
      DATABASE_URL: postgres://platform_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/platform?sslmode=disable
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8092}
      CARD_API_ALLOWED_HOSTS: ${CARD_API_ALLOWED_HOSTS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-GPTibo <noreply@example.invalid>}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_MANUAL_RECIPIENT: ${FEISHU_MANUAL_RECIPIENT:-}
      NOCAPTCHA_TOKEN: ${NOCAPTCHA_TOKEN:-}
      NOCAPTCHA_AUTO: ${NOCAPTCHA_AUTO:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  maintenance:
    image: gptibo-supply:${RELEASE_VERSION:-local}
    profiles: [maintenance]
    command: [migrate]
    environment:
      DATABASE_URL: postgres://platform_owner:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/platform?sslmode=disable
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY}
      RUNTIME_DB_USER: platform_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres:
